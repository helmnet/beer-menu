# Feature 11 changes to api/openapi.yaml (0.9.0 -> 0.10.0). Additions only, plus one new
# 202 response on POST /api/session that clients without 2FA admins never see. Every new route
# refuses API tokens: x-access admin or enroll, or public with a bm_pending cookie required
# (except DELETE /api/session/pending, which needs no cookie and only ever destroys one).
# Shared responses (Invalid, Unauthenticated, Forbidden, NotFound, RateLimited, Busy, Conflict)
# and schemas (Error, Admin, Id) are the existing ones.
#
# Error codes added: invalid_code, confirm_required,
# two_factor_required, totp_unavailable, passkeys_unavailable, passkey_failed, already_set_up,
# no_factor, cannot_clear_self, too_many_passkeys.

paths:
  /api/session:
    post:
      # existing operation; new response only
      responses:
        "202":
          description: >
            Password correct, sign-in not finished. Sets the bm_pending cookie (5 minutes,
            single use) and no session cookie. next=second_factor: send one of methods to the
            matching /api/session/* route. next=enroll: 2FA is required and this admin has none;
            set one up with the x-access enroll routes.
          headers:
            Set-Cookie: { $ref: "#/components/headers/PendingCookie" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SignInPending" }

  /api/session/totp:
    post:
      operationId: signInTotp
      summary: Finish sign-in with an authenticator code
      tags: [auth]
      security: []
      x-access: public
      description: >
        Needs a bm_pending cookie of kind second_factor, else 401. A wrong or reused code is 401
        invalid_code and counts as a sign-in failure for the username (5 per 15 minutes).
        Success ends the pending step and starts a session, as 200 from POST /api/session.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CodeBody" }
      responses:
        "200": { $ref: "#/components/responses/SignedIn" }
        "400": { $ref: "#/components/responses/Invalid" }
        "401": { $ref: "#/components/responses/SecondStepFailed" }
        "429": { $ref: "#/components/responses/RateLimited" }

  /api/session/recovery:
    post:
      operationId: signInRecovery
      summary: Finish sign-in with a recovery code
      tags: [auth]
      security: []
      x-access: public
      description: Same rules as /api/session/totp. The code is spent on success.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CodeBody" }
      responses:
        "200": { $ref: "#/components/responses/SignedIn" }
        "400": { $ref: "#/components/responses/Invalid" }
        "401": { $ref: "#/components/responses/SecondStepFailed" }
        "429": { $ref: "#/components/responses/RateLimited" }

  /api/session/passkey/options:
    post:
      operationId: signInPasskeyOptions
      summary: Get WebAuthn request options for the pending sign-in
      tags: [auth]
      security: []
      x-access: public
      description: >
        Needs a bm_pending cookie of kind second_factor. allowCredentials lists only this
        admin's passkeys; userVerification is required. A new call replaces the earlier
        challenge.
      responses:
        "200":
          description: Options for PublicKeyCredential.parseRequestOptionsFromJSON
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WebAuthnOptions" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "409": { $ref: "#/components/responses/TwoFactorConflict" }

  /api/session/pending:
    delete:
      operationId: cancelSignIn
      summary: Cancel an unfinished sign-in
      tags: [auth]
      security: []
      x-access: public
      description: >
        Deletes the pending sign-in named by the bm_pending cookie, if any, and clears the
        cookie. Always 204, whether or not a pending sign-in existed. Refuses cross-site
        requests like every write. The login Cancel button and the enroll view's Sign out use it.
      responses:
        "204":
          description: Cancelled (or nothing to cancel)
          headers:
            Set-Cookie: { $ref: "#/components/headers/PendingCookie" }

  /api/session/passkey:
    post:
      operationId: signInPasskey
      summary: Finish sign-in with a passkey
      tags: [auth]
      security: []
      x-access: public
      description: >
        Body is credential.toJSON() of the assertion. Checked against the stored challenge,
        BEER_MENU_PUBLIC_URL origin and RP ID, UV flag, signature and sign count. Failure is 401
        passkey_failed and counts as a sign-in failure.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/WebAuthnResponse" }
      responses:
        "200": { $ref: "#/components/responses/SignedIn" }
        "400": { $ref: "#/components/responses/Invalid" }
        "401": { $ref: "#/components/responses/SecondStepFailed" }
        "429": { $ref: "#/components/responses/RateLimited" }

  /api/2fa:
    get:
      operationId: getTwoFactor
      summary: The caller's 2FA state
      tags: [two-factor]
      x-access: enroll
      responses:
        "200":
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TwoFactorState" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
    delete:
      operationId: turnOffTwoFactor
      summary: Remove all of the caller's factors and recovery codes
      tags: [two-factor]
      x-access: admin
      description: Needs a recent confirm. Ends the caller's other sessions. 409 two_factor_required while 2FA is required.
      responses:
        "204": { description: Turned off }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/ConfirmRequired" }
        "409": { $ref: "#/components/responses/TwoFactorConflict" }

  /api/2fa/confirm:
    post:
      operationId: confirmIdentity
      summary: Prove identity before a sensitive change
      tags: [two-factor]
      x-access: admin
      description: >
        Current password, plus one second factor if the caller has any (code, recovery_code or
        passkey, exactly one). Success stamps the session; sensitive routes accept it for 5
        minutes. Failures count toward the sign-in limit. A passkey proof first needs
        POST /api/2fa/confirm/options.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ConfirmBody" }
      responses:
        "204": { description: Confirmed }
        "400": { $ref: "#/components/responses/Invalid" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403":
          description: wrong_password, invalid_code or passkey_failed
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "503": { $ref: "#/components/responses/Busy" }

  /api/2fa/confirm/options:
    post:
      operationId: confirmPasskeyOptions
      summary: WebAuthn request options for a passkey confirm
      tags: [two-factor]
      x-access: admin
      responses:
        "200":
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WebAuthnOptions" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "409": { $ref: "#/components/responses/TwoFactorConflict" }

  /api/2fa/totp/setup:
    post:
      operationId: startTotpSetup
      summary: Start adding an authenticator app
      tags: [two-factor]
      x-access: enroll
      description: >
        Needs a recent confirm (an enroll pending counts as confirmed). Returns a new secret,
        held unconfirmed on the server for 5 minutes. 409 already_set_up if the caller has one,
        totp_unavailable without an encryption key.
      responses:
        "200":
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TotpSetup" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/ConfirmRequired" }
        "409": { $ref: "#/components/responses/TwoFactorConflict" }

  /api/2fa/totp:
    post:
      operationId: finishTotpSetup
      summary: Confirm the authenticator with a current code and save it
      tags: [two-factor]
      x-access: enroll
      description: >
        A wrong code is 400 invalid_code and saves nothing (the setup stays open until it
        expires). If this is the caller's first factor, the response carries 10 recovery codes
        and the caller's other sessions end. With an enroll pending, it also starts a session
        (Set-Cookie) and returns the admin.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CodeBody" }
      responses:
        "201":
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FactorAdded" }
        "400": { $ref: "#/components/responses/Invalid" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/ConfirmRequired" }
        "409": { $ref: "#/components/responses/TwoFactorConflict" }
    delete:
      operationId: removeTotp
      summary: Remove the authenticator app
      tags: [two-factor]
      x-access: admin
      description: Needs a recent confirm. Ends other sessions. Last factor also deletes recovery codes; refused (409 two_factor_required) while required.
      responses:
        "204": { description: Removed }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/ConfirmRequired" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/TwoFactorConflict" }

  /api/2fa/passkeys/options:
    post:
      operationId: startPasskeySetup
      summary: WebAuthn creation options for a new passkey
      tags: [two-factor]
      x-access: enroll
      description: >
        Needs a recent confirm (an enroll pending counts). excludeCredentials lists the caller's
        passkeys; userVerification required; attestation none; residentKey preferred.
      responses:
        "200":
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WebAuthnOptions" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/ConfirmRequired" }
        "409": { $ref: "#/components/responses/TwoFactorConflict" }

  /api/2fa/passkeys:
    post:
      operationId: finishPasskeySetup
      summary: Save a new passkey
      tags: [two-factor]
      x-access: enroll
      description: >
        Same first-factor and enroll rules as POST /api/2fa/totp. At most 10 passkeys per
        admin: an 11th is 409 too_many_passkeys (also checked by /api/2fa/passkeys/options).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [name, credential]
              properties:
                name: { $ref: "#/components/schemas/PasskeyName" }
                credential: { $ref: "#/components/schemas/WebAuthnResponse" }
      responses:
        "201":
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FactorAdded" }
        "400": { $ref: "#/components/responses/Invalid" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/ConfirmRequired" }
        "409": { $ref: "#/components/responses/TwoFactorConflict" }

  /api/2fa/passkeys/{id}:
    parameters: [{ $ref: "#/components/parameters/Id" }]
    patch:
      operationId: renamePasskey
      summary: Rename one of the caller's passkeys
      tags: [two-factor]
      x-access: admin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [name]
              properties:
                name: { $ref: "#/components/schemas/PasskeyName" }
      responses:
        "200":
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Passkey" }
        "400": { $ref: "#/components/responses/Invalid" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      operationId: removePasskey
      summary: Remove one of the caller's passkeys
      tags: [two-factor]
      x-access: admin
      description: Same rules as DELETE /api/2fa/totp. Another admin's passkey id is 404.
      responses:
        "204": { description: Removed }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/ConfirmRequired" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/TwoFactorConflict" }

  /api/2fa/recovery-codes:
    post:
      operationId: replaceRecoveryCodes
      summary: Make a new set of 10 recovery codes
      tags: [two-factor]
      x-access: admin
      description: Needs a recent confirm. All earlier codes stop working. 409 no_factor without 2FA.
      responses:
        "200":
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RecoveryCodes" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/ConfirmRequired" }
        "409": { $ref: "#/components/responses/TwoFactorConflict" }

  /api/2fa/required:
    put:
      operationId: setTwoFactorRequired
      summary: Turn "require 2FA for all admins" on or off
      tags: [two-factor]
      x-access: admin
      description: >
        Needs a recent confirm and a factor of the caller's own (409 no_factor). Turning it on
        ends no sessions; admins without a factor enroll at next sign-in.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [required]
              properties:
                required: { type: boolean }
      responses:
        "204": { description: Saved }
        "400": { $ref: "#/components/responses/Invalid" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/ConfirmRequired" }
        "409": { $ref: "#/components/responses/TwoFactorConflict" }

  /api/admins/{id}/2fa:
    parameters: [{ $ref: "#/components/parameters/Id" }]
    delete:
      operationId: clearAdminTwoFactor
      summary: Clear another admin's factors and recovery codes
      tags: [admins]
      x-access: admin
      description: >
        Deletes all of that admin's factors, recovery codes, pending steps and sessions.
        Allowed while 2FA is required. The caller's own id is 409 cannot_clear_self.
      responses:
        "204": { description: Cleared }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/TwoFactorConflict" }

components:
  headers:
    PendingCookie:
      description: "bm_pending=<id>; Path=/api; Max-Age=300; HttpOnly; SameSite=Strict; Secure"
      schema: { type: string }

  responses:
    SignedIn:
      description: Signed in; same as 200 from POST /api/session
      headers:
        Set-Cookie: { $ref: "#/components/headers/SessionCookie" }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Admin" }
    SecondStepFailed:
      description: unauthenticated (no, expired or used pending step), invalid_code or passkey_failed
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    ConfirmRequired:
      description: confirm_required, no confirm in the last 5 minutes
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    TwoFactorConflict:
      description: >
        two_factor_required, totp_unavailable, passkeys_unavailable, already_set_up, no_factor
        cannot_clear_self or too_many_passkeys
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }

  schemas:
    Admin:
      # existing schema, one added property
      properties:
        two_factor: { type: boolean, description: "Has at least one second factor." }

    SignInPending:
      type: object
      required: [next]
      properties:
        next: { type: string, enum: [second_factor, enroll] }
        methods:
          type: array
          description: Present when next=second_factor. Recovery is listed when unused codes remain.
          items: { type: string, enum: [totp, passkey, recovery] }
        passkeys_origin:
          type: string
          description: >
            Present when methods lists passkey. The origin passkeys work on
            (BEER_MENU_PUBLIC_URL). The client offers passkeys only when its location.origin
            equals it.

    CodeBody:
      type: object
      additionalProperties: false
      required: [code]
      properties:
        code: { type: string, minLength: 1, maxLength: 32, description: "Spaces and dashes ignored." }

    ConfirmBody:
      type: object
      additionalProperties: false
      required: [password]
      properties:
        password: { type: string }
        code: { type: string, maxLength: 32 }
        recovery_code: { type: string, maxLength: 32 }
        passkey: { $ref: "#/components/schemas/WebAuthnResponse" }

    TwoFactorState:
      type: object
      required: [enabled, required, totp_available, passkeys_available, passkeys_origin, totp, passkeys, recovery_codes_left]
      properties:
        enabled: { type: boolean }
        required: { type: boolean, description: "The require-2FA-for-all setting." }
        totp_available: { type: boolean, description: "False without an encryption key." }
        passkeys_available: { type: boolean, description: "False without BEER_MENU_PUBLIC_URL." }
        passkeys_origin:
          type: string
          nullable: true
          description: >
            The configured origin, or null when passkeys are off. The client offers passkeys only
            when its location.origin equals it (FR-016).
        totp:
          nullable: true
          type: object
          required: [created_at]
          properties:
            created_at: { type: string, format: date-time }
            last_used_at: { type: string, format: date-time, nullable: true }
        passkeys:
          type: array
          items: { $ref: "#/components/schemas/Passkey" }
        recovery_codes_left: { type: integer, minimum: 0, maximum: 10 }

    Passkey:
      type: object
      required: [id, name, created_at]
      properties:
        id: { type: integer }
        name: { $ref: "#/components/schemas/PasskeyName" }
        created_at: { type: string, format: date-time }
        last_used_at: { type: string, format: date-time, nullable: true }

    PasskeyName:
      type: string
      minLength: 1
      maxLength: 64
      description: Trimmed; no control characters.

    TotpSetup:
      type: object
      required: [secret, uri]
      properties:
        secret: { type: string, description: "Base32, no padding. Shown once." }
        uri: { type: string, description: "otpauth://totp/Beer%20Menu:<username>?secret=...&issuer=Beer%20Menu" }

    FactorAdded:
      type: object
      properties:
        passkey: { $ref: "#/components/schemas/Passkey" }
        recovery_codes:
          type: array
          description: Present only when this was the first factor. Shown once.
          items: { type: string, pattern: "^[a-z2-7]{5}-[a-z2-7]{5}$" }
        admin: { $ref: "#/components/schemas/Admin" }

    RecoveryCodes:
      type: object
      required: [recovery_codes]
      properties:
        recovery_codes:
          type: array
          minItems: 10
          maxItems: 10
          items: { type: string, pattern: "^[a-z2-7]{5}-[a-z2-7]{5}$" }

    WebAuthnOptions:
      type: object
      description: >
        { publicKey: PublicKeyCredentialCreationOptionsJSON | PublicKeyCredentialRequestOptionsJSON }
        as defined by WebAuthn Level 3, base64url fields.
      required: [publicKey]
      properties:
        publicKey: { type: object }

    WebAuthnResponse:
      type: object
      description: PublicKeyCredential.toJSON() output (WebAuthn Level 3). Max 16 KiB.
      required: [id, rawId, type, response]
      properties:
        id: { type: string }
        rawId: { type: string }
        type: { type: string, enum: [public-key] }
        response: { type: object }
