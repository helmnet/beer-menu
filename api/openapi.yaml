openapi: 3.1.0
info:
  title: Beer Menu API
  version: 0.10.0
  description: >
    REST API for the Beer Menu self-hosted tap list. Served under /api on the same
    origin as the admin app.


    Authentication: browser sessions (cookie `bm_session`, set by POST /api/session or
    POST /api/setup) or API tokens sent as `Authorization: Bearer <token>`. If a bearer
    header is present it alone decides the request. Each operation's `x-access` states who
    may call it: `public` (anyone), `read` (session, read token or write token), `write`
    (session or write token), `admin` (session only), `enroll` (session, or the `bm_pending`
    cookie of an admin who must set up two-factor sign-in before signing in; only the factor
    setup routes). Missing or invalid credentials get 401; valid credentials without the needed
    access get 403. No API token can call an `admin` or `enroll` route.


    Cross-site browser writes are refused with 403 (Sec-Fetch-Site / Origin check).
    Every response under /api except /api/health is sent with `Cache-Control: no-store`.
  license:
    name: Unlicensed
servers:
  - url: /
tags:
  - name: system
    description: Service status
  - name: auth
    description: First-run setup, sign-in and passwords
  - name: admins
    description: Admin accounts
  - name: two-factor
    description: Two-factor sign-in (authenticator apps, passkeys, recovery codes)
  - name: tokens
    description: API tokens
  - name: beers
    description: Beer library
  - name: taps
    description: Taps on the kegerator
  - name: kegs
    description: Kegs, levels and keg history
  - name: menu
    description: The public menu the TV display shows
  - name: brewfather
    description: Brewfather account connection, batch import and sync
  - name: settings
    description: Display settings (TV title, theme, page interval, layout, fonts, colors and tap details; admin volume units)
  - name: docs
    description: Read-only API documentation (Swagger UI) and the raw OpenAPI document
security:
  - session: []
  - bearer: []
paths:
  /api/health:
    get:
      operationId: getHealth
      summary: Report service and database health
      description: >
        Public. Returns 200 when the API is running and the database answers a query,
        503 otherwise. Never returns sensitive data.
      tags: [system]
      security: []
      x-access: public
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
              example:
                status: ok
                version: 0.2.0
                database: ok
        "503":
          description: Database unreachable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
              example:
                status: error
                version: 0.2.0
                database: unreachable

  /api/setup:
    get:
      operationId: getSetup
      summary: Report whether first-run setup is needed
      description: Public. True only while no admin exists. Reveals no usernames.
      tags: [auth]
      security: []
      x-access: public
      responses:
        "200":
          description: Setup state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SetupState"
              example:
                needed: true
    post:
      operationId: createFirstAdmin
      summary: Create the first admin and sign them in
      description: >
        Public, but only while no admin exists. At most one concurrent call succeeds.
        On success, sets the session cookie.
      tags: [auth]
      security: []
      x-access: public
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Credentials"
      responses:
        "201":
          description: First admin created and signed in
          headers:
            Set-Cookie:
              $ref: "#/components/headers/SessionCookie"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Admin"
        "400":
          $ref: "#/components/responses/Invalid"
        "409":
          description: An admin already exists; nothing changed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error: setup_done
                message: Setup is already complete. Sign in instead.

  /api/session:
    post:
      operationId: signIn
      summary: Sign in with username and password
      description: >
        Public. Rate limited: 5 failures per username per 15 minutes.
        Unknown username and wrong password give the same 401, whatever the admin's
        two-factor state. On success, issues a new session ID in the cookie, unless the admin
        has two-factor sign-in or must set it up: then 202.
      tags: [auth]
      security: []
      x-access: public
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Credentials"
      responses:
        "200":
          description: Signed in
          headers:
            Set-Cookie:
              $ref: "#/components/headers/SessionCookie"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Admin"
        "202":
          description: >
            Password correct, sign-in not finished. Sets the bm_pending cookie (5 minutes,
            single use) and no session cookie. next=second_factor: send one of methods to the
            matching /api/session/* route. next=enroll: 2FA is required and this admin has none;
            set one up with the x-access enroll routes.
          headers:
            Set-Cookie:
              $ref: "#/components/headers/PendingCookie"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SignInPending"
        "400":
          $ref: "#/components/responses/Invalid"
        "401":
          description: Wrong username or password
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error: invalid_credentials
                message: Wrong username or password.
        "429":
          $ref: "#/components/responses/RateLimited"
        "503":
          $ref: "#/components/responses/Busy"
    get:
      operationId: getSession
      summary: Return the signed-in admin
      tags: [auth]
      x-access: admin
      responses:
        "200":
          description: Current admin
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Admin"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
    delete:
      operationId: signOut
      summary: Sign out and end this session on the server
      tags: [auth]
      x-access: admin
      responses:
        "204":
          description: Signed out; the cookie is cleared
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/session/pending:
    delete:
      operationId: cancelSignIn
      summary: Cancel an unfinished sign-in
      description: >
        Public. Deletes the pending sign-in named by the bm_pending cookie, if any, and clears
        the cookie. Always 204, whether or not a pending sign-in existed. Refuses cross-site
        requests like every write. The login Cancel button and the enroll view's Sign out use it.
      tags: [auth]
      security: []
      x-access: public
      responses:
        "204":
          description: Cancelled (or nothing to cancel)
          headers:
            Set-Cookie:
              $ref: "#/components/headers/PendingCookie"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/session/totp:
    post:
      operationId: signInTotp
      summary: Finish sign-in with an authenticator code
      description: >
        Public, but needs a bm_pending cookie of kind second_factor, else 401 unauthenticated. A
        wrong or reused code is 401 invalid_code, counts as a sign-in failure for the username
        (5 per 15 minutes) and leaves the pending sign-in usable until it expires. Success ends
        the pending step, clears its cookie and starts a session, as 200 from POST /api/session.
      tags: [auth]
      security: []
      x-access: public
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CodeBody"
      responses:
        "200":
          $ref: "#/components/responses/SignedIn"
        "400":
          $ref: "#/components/responses/Invalid"
        "401":
          $ref: "#/components/responses/SecondStepFailed"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/RateLimited"

  /api/session/recovery:
    post:
      operationId: signInRecovery
      summary: Finish sign-in with a recovery code
      description: >
        Same rules as POST /api/session/totp; spaces, dashes and case in the code are ignored.
        The code is spent, in the same step that ends the pending sign-in. A wrong or spent
        code is 401 invalid_code.
      tags: [auth]
      security: []
      x-access: public
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CodeBody"
      responses:
        "200":
          $ref: "#/components/responses/SignedIn"
        "400":
          $ref: "#/components/responses/Invalid"
        "401":
          $ref: "#/components/responses/SecondStepFailed"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/RateLimited"

  /api/session/passkey/options:
    post:
      operationId: signInPasskeyOptions
      summary: Get WebAuthn request options for the pending sign-in
      description: >
        Public, but needs a bm_pending cookie of kind second_factor, else 401 unauthenticated.
        allowCredentials lists only this admin's passkeys; userVerification is required. A new
        call replaces the earlier challenge. 409 passkeys_unavailable without
        BEER_MENU_PUBLIC_URL, no_factor when the admin has no passkey.
      tags: [auth]
      security: []
      x-access: public
      responses:
        "200":
          description: Options for PublicKeyCredential.parseRequestOptionsFromJSON
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WebAuthnOptions"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/TwoFactorConflict"

  /api/session/passkey:
    post:
      operationId: signInPasskey
      summary: Finish sign-in with a passkey
      description: >
        Public, but needs a bm_pending cookie of kind second_factor, else 401 unauthenticated.
        The body is credential.toJSON() of the assertion for the latest options, checked against
        the stored challenge, the BEER_MENU_PUBLIC_URL origin and RP ID, the user-verified flag,
        the signature and the sign count. A refusal is 401 passkey_failed, uses up the challenge
        (get new options to retry), counts as a sign-in failure for the username and leaves the
        pending sign-in usable until it expires. Success is as 200 from POST /api/session.
      tags: [auth]
      security: []
      x-access: public
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WebAuthnResponse"
      responses:
        "200":
          $ref: "#/components/responses/SignedIn"
        "400":
          $ref: "#/components/responses/Invalid"
        "401":
          $ref: "#/components/responses/SecondStepFailed"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/RateLimited"

  /api/password:
    post:
      operationId: changePassword
      summary: Change the signed-in admin's password
      description: >
        Needs the current password. Wrong current passwords count toward the sign-in rate
        limit for this username. Ends the admin's other sessions; this one stays.
      tags: [auth]
      x-access: admin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PasswordChange"
      responses:
        "204":
          description: Password changed
        "400":
          $ref: "#/components/responses/Invalid"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          description: Wrong current password, or a token was used
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error: wrong_password
                message: The current password is wrong.
        "429":
          $ref: "#/components/responses/RateLimited"
        "503":
          $ref: "#/components/responses/Busy"

  /api/2fa:
    get:
      operationId: getTwoFactor
      summary: Return the caller's two-factor state
      description: >
        Factors (never their secrets), recovery codes left, the require setting, and whether
        this server can add an authenticator (an encryption key is set) and passkeys
        (BEER_MENU_PUBLIC_URL is set).
      tags: [two-factor]
      x-access: enroll
      responses:
        "200":
          description: Two-factor state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TwoFactorState"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
    delete:
      operationId: turnOffTwoFactor
      summary: Remove all of the caller's factors and recovery codes
      description: >
        Needs a recent confirm. Ends the caller's other sessions and pending sign-ins; this
        session stays. 409 no_factor when two-factor sign-in is already off, two_factor_required
        while 2FA is required for every admin.
      tags: [two-factor]
      x-access: admin
      responses:
        "204":
          description: Turned off
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/ConfirmRequired"
        "409":
          $ref: "#/components/responses/TwoFactorConflict"

  /api/2fa/confirm:
    post:
      operationId: confirmIdentity
      summary: Prove identity before a sensitive change
      description: >
        Current password, plus exactly one second factor (code, recovery_code or passkey) if the
        caller has any. Success stamps the session; sensitive routes accept it for 5 minutes.
        Rate limited with sign-in: failures count toward the 5 per username per 15 minutes. A
        recovery code is spent. A passkey proof first needs POST /api/2fa/confirm/options.
      tags: [two-factor]
      x-access: admin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ConfirmBody"
      responses:
        "204":
          description: Confirmed
        "400":
          $ref: "#/components/responses/Invalid"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          description: wrong_password, invalid_code or passkey_failed, or a token was used
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error: invalid_code
                message: That code did not work.
        "429":
          $ref: "#/components/responses/RateLimited"
        "503":
          $ref: "#/components/responses/Busy"

  /api/2fa/confirm/options:
    post:
      operationId: confirmPasskeyOptions
      summary: WebAuthn request options for a passkey confirm
      description: >
        allowCredentials lists only the caller's passkeys; userVerification is required. Held on
        the session for 5 minutes; a new call replaces it. 409 passkeys_unavailable without
        BEER_MENU_PUBLIC_URL, no_factor when the caller has no passkey.
      tags: [two-factor]
      x-access: admin
      responses:
        "200":
          description: Options for PublicKeyCredential.parseRequestOptionsFromJSON
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WebAuthnOptions"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/TwoFactorConflict"

  /api/2fa/totp/setup:
    post:
      operationId: startTotpSetup
      summary: Start adding an authenticator app
      description: >
        Needs a recent confirm (sign-in or POST /api/2fa/confirm in the last 5 minutes); an
        enroll pending counts as confirmed. Returns a new secret, held unconfirmed on the server
        for 5 minutes (with an enroll pending, until that sign-in expires); a new call replaces
        it. 409 already_set_up if the caller has an authenticator, totp_unavailable without an
        encryption key.
      tags: [two-factor]
      x-access: enroll
      responses:
        "200":
          description: The new secret, shown once
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TotpSetup"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/ConfirmRequired"
        "409":
          $ref: "#/components/responses/TwoFactorConflict"

  /api/2fa/totp:
    post:
      operationId: finishTotpSetup
      summary: Confirm the authenticator with a current code and save it
      description: >
        Needs a recent confirm (an enroll pending counts). A wrong code, or no setup open, is
        400 invalid_code and saves nothing (the setup stays open until it expires). If this is
        the caller's first factor, the response carries 10 recovery codes and the caller's other
        sessions end. With an enroll pending, it also ends that pending sign-in, clears
        bm_pending, starts a session (Set-Cookie as from POST /api/session) and returns the
        admin.
      tags: [two-factor]
      x-access: enroll
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CodeBody"
      responses:
        "201":
          description: Saved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FactorAdded"
        "400":
          description: invalid_request, or invalid_code for a wrong code
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error: invalid_code
                message: That code did not work.
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/ConfirmRequired"
        "409":
          $ref: "#/components/responses/TwoFactorConflict"
    delete:
      operationId: removeTotp
      summary: Remove the authenticator app
      description: >
        Needs a recent confirm. Ends the caller's other sessions and pending sign-ins; this
        session stays. Removing the last factor also deletes the recovery codes, and is refused
        (409 two_factor_required) while 2FA is required for every admin. 404 when no
        authenticator is set up.
      tags: [two-factor]
      x-access: admin
      responses:
        "204":
          description: Removed
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/ConfirmRequired"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/TwoFactorConflict"

  /api/2fa/passkeys/options:
    post:
      operationId: startPasskeySetup
      summary: WebAuthn creation options for a new passkey
      description: >
        Needs a recent confirm (an enroll pending counts). excludeCredentials lists the caller's
        passkeys; userVerification required; attestation none; residentKey preferred. Held on
        the server for 5 minutes (with an enroll pending, until that sign-in expires); a new
        call replaces it. 409 passkeys_unavailable without BEER_MENU_PUBLIC_URL,
        too_many_passkeys at 10.
      tags: [two-factor]
      x-access: enroll
      responses:
        "200":
          description: Options for PublicKeyCredential.parseCreationOptionsFromJSON
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WebAuthnOptions"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/ConfirmRequired"
        "409":
          $ref: "#/components/responses/TwoFactorConflict"

  /api/2fa/passkeys:
    post:
      operationId: finishPasskeySetup
      summary: Save a new passkey
      description: >
        Needs a recent confirm. credential is credential.toJSON() of the creation for the latest
        options. A refused credential, or no setup open, is 400 passkey_failed and saves nothing.
        At most 10 passkeys per admin: an 11th is 409 too_many_passkeys. If this is the caller's
        first factor, the response carries 10 recovery codes and the caller's other sessions
        end. An enroll pending counts as confirmed and is finished as by POST /api/2fa/totp.
      tags: [two-factor]
      x-access: enroll
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [name, credential]
              properties:
                name:
                  $ref: "#/components/schemas/PasskeyName"
                credential:
                  $ref: "#/components/schemas/WebAuthnResponse"
      responses:
        "201":
          description: Saved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FactorAdded"
        "400":
          description: invalid_request (bad name or body), or passkey_failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error: passkey_failed
                message: The passkey could not be added. Try again.
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/ConfirmRequired"
        "409":
          $ref: "#/components/responses/TwoFactorConflict"

  /api/2fa/passkeys/{id}:
    patch:
      operationId: renamePasskey
      summary: Rename one of the caller's passkeys
      description: Needs no recent confirm. Another admin's passkey id is 404.
      tags: [two-factor]
      x-access: admin
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [name]
              properties:
                name:
                  $ref: "#/components/schemas/PasskeyName"
      responses:
        "200":
          description: Renamed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Passkey"
        "400":
          $ref: "#/components/responses/Invalid"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      operationId: removePasskey
      summary: Remove one of the caller's passkeys
      description: Same rules as DELETE /api/2fa/totp. Another admin's passkey id is 404.
      tags: [two-factor]
      x-access: admin
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "204":
          description: Removed
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/ConfirmRequired"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/TwoFactorConflict"

  /api/2fa/recovery-codes:
    post:
      operationId: replaceRecoveryCodes
      summary: Make a new set of 10 recovery codes
      description: >
        Needs a recent confirm. All earlier codes stop working. 409 no_factor without a second
        factor.
      tags: [two-factor]
      x-access: admin
      responses:
        "200":
          description: The new codes, shown once
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RecoveryCodes"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/ConfirmRequired"
        "409":
          $ref: "#/components/responses/TwoFactorConflict"

  /api/2fa/required:
    put:
      operationId: setTwoFactorRequired
      summary: Turn "require 2FA for all admins" on or off
      description: >
        Needs a recent confirm and a second factor of the caller's own (409 no_factor). Turning
        it on ends no sessions; admins without a factor must set one up at their next sign-in.
        While it is on, no admin can remove their last factor or turn 2FA off. Not part of
        GET or PATCH /api/settings.
      tags: [two-factor]
      x-access: admin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [required]
              properties:
                required:
                  type: boolean
      responses:
        "204":
          description: Saved
        "400":
          $ref: "#/components/responses/Invalid"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/ConfirmRequired"
        "409":
          $ref: "#/components/responses/TwoFactorConflict"

  /api/admins:
    get:
      operationId: listAdmins
      summary: List admins
      tags: [admins]
      x-access: admin
      responses:
        "200":
          description: All admins, oldest first
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Admin"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      operationId: addAdmin
      summary: Add an admin
      tags: [admins]
      x-access: admin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Credentials"
      responses:
        "201":
          description: Admin added
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Admin"
        "400":
          $ref: "#/components/responses/Invalid"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          description: Username taken (ignoring case)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error: username_taken
                message: That username is already in use.
        "503":
          $ref: "#/components/responses/Busy"

  /api/admins/{id}:
    delete:
      operationId: removeAdmin
      summary: Remove an admin and end all their sessions
      description: Any admin, including the caller, except the last one.
      tags: [admins]
      x-access: admin
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "204":
          description: Removed
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: This is the last admin
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error: last_admin
                message: The last admin cannot be removed.

  /api/admins/{id}/2fa:
    delete:
      operationId: clearAdminTwoFactor
      summary: Clear another admin's factors and recovery codes
      description: >
        Deletes all of that admin's factors, recovery codes, pending sign-ins and sessions.
        Needs no confirm, and works while 2FA is required. The caller's own id is 409
        cannot_clear_self.
      tags: [admins]
      x-access: admin
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "204":
          description: Cleared
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/TwoFactorConflict"

  /api/tokens:
    get:
      operationId: listTokens
      summary: List API tokens, including revoked ones
      description: Never returns secrets or hashes.
      tags: [tokens]
      x-access: admin
      responses:
        "200":
          description: All tokens, newest first
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Token"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      operationId: createToken
      summary: Create an API token
      description: The response is the only time the secret is shown.
      tags: [tokens]
      x-access: admin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TokenRequest"
      responses:
        "201":
          description: Token created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NewToken"
        "400":
          $ref: "#/components/responses/Invalid"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/tokens/{id}:
    delete:
      operationId: revokeToken
      summary: Revoke an API token
      description: >
        Takes effect on the next request. The token stays in the list, marked revoked.
        Revoking a revoked token succeeds and changes nothing.
      tags: [tokens]
      x-access: admin
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "204":
          description: Revoked
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/beers:
    get:
      operationId: listBeers
      summary: List beers
      description: >
        Needs a session or any API token. Current beers by default; `archived=true` lists only
        archived beers. Sorted by name (case-insensitive), then id.
      tags: [beers]
      x-access: read
      parameters:
        - name: archived
          in: query
          required: false
          schema:
            type: boolean
            default: false
      responses:
        "200":
          description: Beers
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Beer"
        "400":
          $ref: "#/components/responses/Invalid"
        "401":
          $ref: "#/components/responses/Unauthenticated"
    post:
      operationId: createBeer
      summary: Create a beer
      description: Source is always manual. Body at most 16 KiB.
      tags: [beers]
      x-access: write
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BeerCreate"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Beer"
        "400":
          $ref: "#/components/responses/InvalidBeer"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/beers/{id}:
    get:
      operationId: getBeer
      summary: Read one beer, archived or not
      tags: [beers]
      x-access: read
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: The beer
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Beer"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      operationId: updateBeer
      summary: Edit, archive or restore a beer
      description: >
        Merge-patch semantics: absent fields are kept, null clears an optional field.
        `archived: true` archives (keeps an existing archived_at), `archived: false` restores.
        Body at most 16 KiB.
      tags: [beers]
      x-access: write
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BeerPatch"
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: The updated beer
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Beer"
        "400":
          $ref: "#/components/responses/InvalidBeer"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
    delete:
      operationId: deleteBeer
      summary: Delete a beer permanently
      tags: [beers]
      x-access: write
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "204":
          description: Deleted
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
  /api/beers/{id}/sync:
    post:
      operationId: resyncBeer
      summary: Re-sync one imported beer from its batch
      description: >
        Overwrites ABV, IBU, SRM, brew date and status only; may archive the beer when its batch
        was archived (archive waits while the beer has a current keg). A missing batch marks
        the beer not found and changes nothing else (still 200). Allowed for archived beers.
      tags: [beers, brewfather]
      x-access: write
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: The beer after the re-sync and the fields that were cleaned
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [beer, adjusted]
                properties:
                  beer:
                    $ref: "#/components/schemas/Beer"
                  adjusted:
                    type: array
                    items: {type: string}
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/BrewfatherConflict"
        "429":
          $ref: "#/components/responses/BrewfatherRateLimited"
        "502":
          $ref: "#/components/responses/BrewfatherUnreachable"
        "503":
          $ref: "#/components/responses/BrewfatherNotConfigured"

  /api/srm-colors:
    get:
      operationId: getSrmColors
      summary: The SRM color table
      description: >
        Needs a session or any API token. `colors[i]` is the color for SRM i+1 (1 to 40).
        Clients round SRM to the nearest integer and clamp to 1..40, as the API does for
        Beer.color.
      tags: [beers]
      x-access: read
      responses:
        "200":
          description: The table
          content:
            application/json:
              schema:
                type: object
                required: [colors]
                additionalProperties: false
                properties:
                  colors:
                    type: array
                    minItems: 40
                    maxItems: 40
                    items:
                      $ref: "#/components/schemas/HexColor"
        "401":
          $ref: "#/components/responses/Unauthenticated"

  /api/taps:
    get:
      operationId: listTaps
      summary: List taps in position order, each with its current keg
      tags: [taps]
      x-access: read
      responses:
        "200":
          description: Taps
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Tap"
        "401":
          $ref: "#/components/responses/Unauthenticated"
    post:
      operationId: createTap
      summary: Add a tap at the end
      description: Without a label the tap is named "Tap N", N being its new position.
      tags: [taps]
      x-access: write
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TapCreate"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Tap"
        "400":
          $ref: "#/components/responses/InvalidBeer"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
  /api/taps/order:
    put:
      operationId: reorderTaps
      summary: Set the order of all taps
      description: >
        `ids` must list every tap exactly once, first to last. Positions become 1..N in that
        order. Returns the taps in the new order.
      tags: [taps]
      x-access: write
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TapOrder"
      responses:
        "200":
          description: Taps in the new order
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Tap"
        "400":
          $ref: "#/components/responses/InvalidBeer"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
  /api/taps/{id}:
    get:
      operationId: getTap
      summary: Read one tap with its current keg
      tags: [taps]
      x-access: read
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: The tap
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Tap"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      operationId: updateTap
      summary: Rename, enable or disable a tap
      tags: [taps]
      x-access: write
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TapPatch"
      responses:
        "200":
          description: The tap
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Tap"
        "400":
          $ref: "#/components/responses/InvalidBeer"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      operationId: deleteTap
      summary: Remove a tap
      description: >
        Refused with 409 `tap_has_keg` while a current keg is on it, and `last_tap` for the only
        tap. Positions after it close up. Kicked kegs that were on it keep their tap label.
      tags: [taps]
      x-access: write
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "204":
          description: Removed
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
  /api/kegs:
    get:
      operationId: listKegs
      summary: List kegs
      description: >
        `state=current` (default) lists kegs on a tap and waiting, oldest first; `waiting` only
        kegs off a tap; `kicked` the keg history, newest kicked first. `beer_id` and `tap_id`
        filter further; `tap_id` matches kegs on that tap or kicked while on it, not kegs taken
        off it before kicking or kegs whose tap was removed.
      tags: [kegs]
      x-access: read
      parameters:
        - name: state
          in: query
          required: false
          schema:
            type: string
            enum: [current, waiting, kicked]
            default: current
        - name: beer_id
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
        - name: tap_id
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
      responses:
        "200":
          description: Kegs
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Keg"
        "400":
          $ref: "#/components/responses/Invalid"
        "401":
          $ref: "#/components/responses/Unauthenticated"
    post:
      operationId: createKeg
      summary: Create a keg, on a tap or waiting
      description: >
        `type` defaults to `corny_5_gal`; `size_l` to the type's size; `remaining_l` to
        `size_l`. With `tap_id` the keg goes on that tap and `tapped_at` is now; a tap that
        already has a keg gives 409 `tap_occupied`. Volumes are rounded to 0.01 L.
      tags: [kegs]
      x-access: write
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/KegCreate"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Keg"
        "400":
          $ref: "#/components/responses/InvalidBeer"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
  /api/kegs/{id}:
    get:
      operationId: getKeg
      summary: Read one keg
      tags: [kegs]
      x-access: read
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: The keg
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Keg"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      operationId: updateKeg
      summary: Correct, set level, move or kick a keg
      description: >
        Merge-patch. `type` alone changes only the type, not the size; send `size_l` too to
        change it. `remaining_l` sets the level. `tap_id` moves the keg onto an empty tap, or
        off its tap with `null`. `kicked: true` kicks it, freeing its tap. A `size_l` below the
        remaining volume lowers it to the new size. On a kicked keg anything but a repeat
        `{"kicked": true}` gives 409 `keg_kicked`.
      tags: [kegs]
      x-access: write
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/KegPatch"
      responses:
        "200":
          description: The keg
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Keg"
        "400":
          $ref: "#/components/responses/InvalidBeer"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
    delete:
      operationId: deleteKeg
      summary: Delete a keg record permanently
      tags: [kegs]
      x-access: write
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "204":
          description: Deleted
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/kegs/{id}/pours:
    post:
      operationId: pourKeg
      summary: Record a pour
      description: >
        Subtracts `amount_l` from the remaining volume, stopping at 0. Concurrent pours all
        count. Never kicks the keg. For Home Assistant and keg scales with a `write` token; this
        operation stays backward compatible within the major version.
      tags: [kegs]
      x-access: write
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Pour"
      responses:
        "200":
          description: The keg after the pour
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Keg"
        "400":
          $ref: "#/components/responses/InvalidBeer"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
  /api/keg-types:
    get:
      operationId: listKegTypes
      summary: The fixed keg type table
      tags: [kegs]
      x-access: read
      responses:
        "200":
          description: Keg types
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/KegType"
        "401":
          $ref: "#/components/responses/Unauthenticated"

  /api/menu:
    get:
      operationId: getMenu
      summary: Read the menu the TV shows
      description: >
        Public on the LAN: no credential. Returns enabled taps in position order and the on-deck
        list, with only the fields the TV display draws. No ids, sizes, volumes or timestamps;
        clients that need those use the credentialed tap and keg reads. Tap beers also carry
        `srm` and `description` when set; on deck beers never do. `display` holds every TV
        setting; units are not public. Never cached
        (Cache-Control no-store).
      tags: [menu]
      security: []
      x-access: public
      responses:
        "200":
          description: The menu
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Menu"
              example:
                taps:
                  - label: Tap 1
                    beer: { name: Pale Ale, style: American Pale Ale, abv: 5.2, ibu: 35, color: "#e58500", srm: 6, description: Bright and hoppy. }
                    keg: { shape: corny, level: 0.6 }
                  - label: Tap 2
                    beer: null
                    keg: null
                on_deck:
                  - beer: { name: Stout, style: Dry Irish Stout, abv: 4.2, ibu: 40, color: "#36080a" }
                    keg: { shape: sanke, level: 1 }
                    status: null
                  - beer: { name: Saison, style: null, abv: null, ibu: null, color: null }
                    keg: null
                    status: fermenting
                display:
                  title: Helm Taproom
                  theme: dark
                  page_seconds: 15
                  layout: grid
                  title_align: left
                  title_font: system
                  text_font: system
                  show_style: true
                  show_abv: true
                  show_ibu: true
                  show_srm: false
                  show_description: false
                  title_color: ""
                  text_color: ""

  /api/docs:
    get:
      operationId: getDocs
      summary: Show the API documentation page
      description: >
        Public. Read-only Swagger UI for this document: no "Try it out" and no Authorize.
        All scripts and styles are served from /api/docs/{file}; the page loads nothing from
        another origin. Sent with its own Content-Security-Policy allowing only same-origin
        scripts, styles and connections.
      tags: [docs]
      security: []
      x-access: public
      responses:
        "200":
          description: The docs page
          content:
            text/html:
              schema:
                type: string

  /api/docs/{file}:
    get:
      operationId: getDocsAsset
      summary: Fetch one file of the documentation page
      description: >
        Public. Serves only the fixed set of files the docs page uses; any other name is 404.
      tags: [docs]
      security: []
      x-access: public
      parameters:
        - name: file
          in: path
          required: true
          schema:
            type: string
            enum:
              - init.js
              - swagger-ui-bundle.js
              - swagger-ui.css
              - LICENSE
              - NOTICE
              - swagger-ui-bundle.js.LICENSE.txt
      responses:
        "200":
          description: The file
          content:
            text/javascript:
              schema:
                type: string
            text/css:
              schema:
                type: string
            text/plain:
              schema:
                type: string
        "404":
          $ref: "#/components/responses/NotFound"

  /api/openapi.yaml:
    get:
      operationId: getOpenAPI
      summary: Download this API contract
      description: >
        Public. The OpenAPI document the running API was built with, byte-identical to
        api/openapi.yaml for this release.
      tags: [docs]
      security: []
      x-access: public
      responses:
        "200":
          description: The OpenAPI document
          content:
            application/yaml:
              schema:
                type: string

  /api/settings:
    get:
      operationId: getSettings
      summary: Read the display settings
      description: >
        Any admin session or token (read or write). Each setting is its stored value, or its
        default when never set or when the stored value is not valid.
      tags: [settings]
      x-access: read
      responses:
        "200":
          description: All display settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Settings"
              example:
                title: ""
                theme: dark
                units: us
                page_seconds: 15
                layout: grid
                title_align: left
                title_font: system
                text_font: system
                show_style: true
                show_abv: true
                show_ibu: true
                show_srm: false
                show_description: false
                title_color: ""
                text_color: ""
        "401":
          $ref: "#/components/responses/Unauthenticated"
    patch:
      operationId: updateSettings
      summary: Change some display settings
      description: >
        Merge patch: only the named settings change. Every named field is validated before any
        is stored; an invalid field changes nothing and is named in `fields`. Null, unknown
        fields and an empty object are refused. Returns all settings after the change.
      tags: [settings]
      x-access: write
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SettingsPatch"
            example: { title: Helm Taproom, page_seconds: 20, layout: columns, show_srm: true, title_color: "#ffaa00" }
      responses:
        "200":
          description: All display settings after the change
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Settings"
        "400":
          $ref: "#/components/responses/InvalidBeer"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/brewfather:
    get:
      operationId: getBrewfather
      summary: Read the Brewfather connection and sync status
      description: Never includes the user ID or any part of the API key.
      tags: [brewfather]
      x-access: read
      responses:
        "200":
          description: The status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BrewfatherStatus"
              example:
                configured: true
                connected: true
                reconnect_needed: false
                interval: 1h
                sync_running: false
                retry_at: null
                last_sync:
                  started_at: "2026-11-09T18:00:00Z"
                  finished_at: "2026-11-09T18:00:03Z"
                  ok: true
                  message: Updated 4 beers, imported 1.
                  updated: 4
                  imported: 1
                  not_found: 0
        "401":
          $ref: "#/components/responses/Unauthenticated"
  /api/brewfather/connection:
    put:
      operationId: connectBrewfather
      summary: Connect or replace the Brewfather account
      description: >
        Checks the credentials with one Brewfather batch read before storing anything. The key
        is stored encrypted and is never returned. Admin session only. Body at most 8 KiB.
      tags: [brewfather]
      x-access: admin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BrewfatherCredentials"
      responses:
        "200":
          description: Connected; the new status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BrewfatherStatus"
        "400":
          $ref: "#/components/responses/BrewfatherRefused"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/BrewfatherRateLimited"
        "502":
          $ref: "#/components/responses/BrewfatherUnreachable"
        "503":
          $ref: "#/components/responses/BrewfatherNotConfigured"
    delete:
      operationId: disconnectBrewfather
      summary: Disconnect Brewfather and forget the credentials
      description: Imported beers stay. Scheduled sync stops. Idempotent. Admin session only.
      tags: [brewfather]
      x-access: admin
      responses:
        "204":
          description: Disconnected
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
  /api/brewfather/schedule:
    put:
      operationId: setBrewfatherSchedule
      summary: Set the automatic sync interval
      tags: [brewfather]
      x-access: admin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [interval]
              properties:
                interval:
                  $ref: "#/components/schemas/SyncInterval"
      responses:
        "200":
          description: The new status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BrewfatherStatus"
        "400":
          $ref: "#/components/responses/Invalid"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
  /api/brewfather/batches:
    get:
      operationId: listBrewfatherBatches
      summary: List every batch in the connected account that is not archived
      description: >
        Archived batches are never listed or imported. Write access because each fresh list spends the owner's Brewfather quota. Served from a
        5-minute cache unless refresh=true. Newest brew date first. `beer_id` is read from this
        app's database on every call, so it is never stale.
      tags: [brewfather]
      x-access: write
      parameters:
        - name: refresh
          in: query
          required: false
          schema: {type: boolean, default: false}
      responses:
        "200":
          description: The batches
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [batches, fetched_at]
                properties:
                  fetched_at: {type: string, format: date-time}
                  batches:
                    type: array
                    items:
                      $ref: "#/components/schemas/BatchSummary"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/BrewfatherNotConnected"
        "429":
          $ref: "#/components/responses/BrewfatherRateLimited"
        "502":
          $ref: "#/components/responses/BrewfatherUnreachable"
        "503":
          $ref: "#/components/responses/BrewfatherNotConfigured"
  /api/brewfather/imports:
    post:
      operationId: importBrewfatherBatches
      summary: Import batches as beers
      description: >
        Reads each batch fresh and creates one beer per batch, with the batch ID as the beer's
        source_ref. A batch already linked to a beer is reported, not duplicated. A batch that
        is archived in Brewfather is refused with outcome `archived`. Each batch is handled on its own; the answer is 200 with a
        result per batch even when some fail. The request answers within 20 s: on a deadline
        or an unreachable Brewfather the untried batches report `failed` ("Not attempted"). If
        Brewfather's rate limit is already in force, the request is refused with 429 before any
        call; a limit hit midway stops the remaining batches, which report `rate_limited`.
      tags: [brewfather]
      x-access: write
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [batch_ids]
              properties:
                batch_ids:
                  type: array
                  minItems: 1
                  maxItems: 50
                  uniqueItems: true
                  items: {type: string, minLength: 1, maxLength: 100}
      responses:
        "200":
          description: One result per requested batch, in request order
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [results]
                properties:
                  results:
                    type: array
                    items:
                      $ref: "#/components/schemas/ImportResult"
        "400":
          $ref: "#/components/responses/Invalid"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/BrewfatherNotConnected"
        "429":
          $ref: "#/components/responses/BrewfatherRateLimited"
        "503":
          $ref: "#/components/responses/BrewfatherNotConfigured"
  /api/brewfather/sync:
    post:
      operationId: syncBrewfather
      summary: Run a sync now
      description: >
        Starts the same sync the schedule runs, in the background, and answers at once. Poll
        GET /api/brewfather until sync_running is false, then read last_sync.
      tags: [brewfather]
      x-access: write
      responses:
        "202":
          description: Sync started; the status with sync_running true
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BrewfatherStatus"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/BrewfatherConflict"
        "429":
          $ref: "#/components/responses/BrewfatherRateLimited"
        "503":
          $ref: "#/components/responses/BrewfatherNotConfigured"

components:
  securitySchemes:
    session:
      type: apiKey
      in: cookie
      name: bm_session
      description: HttpOnly, SameSite=Strict session cookie; Secure unless disabled by config.
    bearer:
      type: http
      scheme: bearer
      description: API token (`bmt_...`) with scope `read` or `write`.
  parameters:
    Id:
      name: id
      in: path
      required: true
      schema:
        type: integer
        minimum: 1
  headers:
    SessionCookie:
      description: "`bm_session=<id>; Path=/; HttpOnly; SameSite=Strict; Secure`"
      schema:
        type: string
    PendingCookie:
      description: "`bm_pending=<id>; Path=/api; Max-Age=300; HttpOnly; SameSite=Strict; Secure`"
      schema:
        type: string
  responses:
    Invalid:
      description: Request body is malformed or breaks a validation rule
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error: invalid_request
            message: Password must be 12 to 256 characters.
    Unauthenticated:
      description: No valid session or token
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error: unauthenticated
            message: Sign in or send a valid API token.
    Forbidden:
      description: Credentials lack the needed access, or a cross-site write was refused
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error: forbidden
            message: This credential cannot do that.
    NotFound:
      description: No such item
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error: not_found
            message: Not found.
    RateLimited:
      description: Too many failed attempts
      headers:
        Retry-After:
          description: Seconds until another attempt is allowed
          schema:
            type: integer
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error: too_many_attempts
            message: Too many failed attempts. Try again in 14 minutes.
    Busy:
      description: Too many password checks running at once
      headers:
        Retry-After:
          schema:
            type: integer
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error: busy
            message: Server busy. Try again shortly.
    SignedIn:
      description: Signed in; same as 200 from POST /api/session
      headers:
        Set-Cookie:
          $ref: "#/components/headers/SessionCookie"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Admin"
    SecondStepFailed:
      description: unauthenticated (no, expired or used pending sign-in), invalid_code or passkey_failed
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error: invalid_code
            message: That code did not work.
    ConfirmRequired:
      description: >
        confirm_required: no sign-in or confirm in the last 5 minutes; or forbidden for a token
        or a cross-site write
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error: confirm_required
            message: Confirm it is you first.
    TwoFactorConflict:
      description: >
        The change conflicts with two-factor state. `error` is `two_factor_required` (it would
        leave the caller without a factor while 2FA is required for every admin),
        `totp_unavailable` (no encryption key), `already_set_up`, `passkeys_unavailable` (no BEER_MENU_PUBLIC_URL),
        `too_many_passkeys` (10 already), `no_factor` (no passkey to check, or no second factor
        at all) or `cannot_clear_self` (clearing the caller's own factors as another admin).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    InvalidBeer:
      description: Invalid request; `fields` names each invalid field when validation failed
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ValidationError"
          example:
            error: invalid_request
            message: Some fields are invalid.
            fields:
              abv: Must be 0 to 25 with at most one decimal place.
    Conflict:
      description: >
        The change conflicts with current state. `error` is one of `tap_occupied`,
        `tap_has_keg`, `last_tap`, `keg_kicked`, `beer_has_keg`, `beer_has_kegs`.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    BrewfatherNotConfigured:
      description: The server has no encryption key (BEER_MENU_SECRET_KEY or _FILE)
      content:
        application/json:
          schema: {$ref: "#/components/schemas/Error"}
          example: {error: not_configured, message: Brewfather import is not set up on this server.}
    BrewfatherNotConnected:
      description: No account is connected, or its credentials need re-entering
      content:
        application/json:
          schema: {$ref: "#/components/schemas/Error"}
          example: {error: not_connected, message: Connect a Brewfather account first.}
    BrewfatherConflict:
      description: >
        not_connected, reconnect_needed, sync_running, or (re-sync) not_imported for a manual
        beer
      content:
        application/json:
          schema: {$ref: "#/components/schemas/Error"}
          example: {error: sync_running, message: A sync is already running.}
    BrewfatherRefused:
      description: Invalid body, or Brewfather refused the credentials (credentials_refused, no_batch_access)
      content:
        application/json:
          schema: {$ref: "#/components/schemas/Error"}
          example: {error: credentials_refused, message: Brewfather refused this user ID and API key.}
    BrewfatherRateLimited:
      description: Brewfather's rate limit is in force
      headers:
        Retry-After:
          schema: {type: integer}
          description: Seconds until calls resume
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required: [error, message, retry_at]
            properties:
              error: {type: string}
              message: {type: string}
              retry_at: {type: string, format: date-time}
          example: {error: provider_rate_limited, message: Brewfather's rate limit is reached. Try again after 18:42., retry_at: "2026-11-09T18:42:00Z"}
    BrewfatherUnreachable:
      description: Brewfather timed out, failed, or sent an unreadable response
      content:
        application/json:
          schema: {$ref: "#/components/schemas/Error"}
          example: {error: provider_unreachable, message: Brewfather could not be reached; try again.}
  schemas:
    Health:
      type: object
      additionalProperties: false
      required: [status, version, database]
      properties:
        status:
          type: string
          enum: [ok, error]
        version:
          type: string
          description: Release version X.Y.Z, or "dev" for local builds.
          examples: ["0.2.0", "dev"]
        database:
          type: string
          enum: [ok, unreachable]
    Error:
      type: object
      additionalProperties: false
      required: [error, message]
      properties:
        error:
          type: string
          description: Stable machine-readable code.
        message:
          type: string
          description: Human-readable text for display.
    SetupState:
      type: object
      additionalProperties: false
      required: [needed]
      properties:
        needed:
          type: boolean
    Credentials:
      type: object
      additionalProperties: false
      required: [username, password]
      properties:
        username:
          type: string
          description: Trimmed, then 1 to 64 of A-Z a-z 0-9 . _ - ; unique ignoring case.
          examples: ["owner"]
        password:
          type: string
          format: password
          minLength: 12
          maxLength: 256
    PasswordChange:
      type: object
      additionalProperties: false
      required: [current_password, new_password]
      properties:
        current_password:
          type: string
          format: password
        new_password:
          type: string
          format: password
          minLength: 12
          maxLength: 256
    Admin:
      type: object
      additionalProperties: false
      required: [id, username, created_at, two_factor]
      properties:
        id:
          type: integer
        username:
          type: string
        created_at:
          type: string
          format: date-time
        two_factor:
          type: boolean
          description: Has at least one second factor.
    SignInPending:
      type: object
      additionalProperties: false
      required: [next]
      properties:
        next:
          type: string
          enum: [second_factor, enroll]
        methods:
          type: array
          description: Present when next=second_factor. Recovery is listed when unused codes remain.
          items:
            type: string
            enum: [totp, passkey, recovery]
        passkeys_origin:
          type: string
          description: >
            Present when methods lists passkey. The origin passkeys work on
            (BEER_MENU_PUBLIC_URL). The client offers passkeys only when its location.origin
            equals it.
    CodeBody:
      type: object
      additionalProperties: false
      required: [code]
      properties:
        code:
          type: string
          minLength: 1
          maxLength: 32
          description: Spaces and dashes ignored.
    ConfirmBody:
      type: object
      additionalProperties: false
      required: [password]
      properties:
        password:
          type: string
          format: password
        code:
          type: string
          maxLength: 32
        recovery_code:
          type: string
          maxLength: 32
        passkey:
          $ref: "#/components/schemas/WebAuthnResponse"
    TwoFactorState:
      type: object
      additionalProperties: false
      required: [enabled, required, totp_available, passkeys_available, passkeys_origin, totp, passkeys, recovery_codes_left]
      properties:
        enabled:
          type: boolean
        required:
          type: boolean
          description: The require-2FA-for-all setting.
        totp_available:
          type: boolean
          description: False without an encryption key.
        passkeys_available:
          type: boolean
          description: False without BEER_MENU_PUBLIC_URL.
        passkeys_origin:
          type: [string, "null"]
          description: >
            The configured origin, or null when passkeys are off. The client offers passkeys only
            when its location.origin equals it (FR-016).
        totp:
          type: [object, "null"]
          additionalProperties: false
          required: [created_at, last_used_at]
          properties:
            created_at:
              type: string
              format: date-time
            last_used_at:
              type: [string, "null"]
              format: date-time
        passkeys:
          type: array
          items:
            $ref: "#/components/schemas/Passkey"
        recovery_codes_left:
          type: integer
          minimum: 0
          maximum: 10
    Passkey:
      type: object
      additionalProperties: false
      required: [id, name, created_at, last_used_at]
      properties:
        id:
          type: integer
        name:
          $ref: "#/components/schemas/PasskeyName"
        created_at:
          type: string
          format: date-time
        last_used_at:
          type: [string, "null"]
          format: date-time
    PasskeyName:
      type: string
      minLength: 1
      maxLength: 64
      description: Trimmed; no control characters.
    TotpSetup:
      type: object
      additionalProperties: false
      required: [secret, uri]
      properties:
        secret:
          type: string
          description: Base32, no padding. Shown once.
        uri:
          type: string
          description: "otpauth://totp/Beer%20Menu:<username>?secret=...&issuer=Beer%20Menu"
    FactorAdded:
      type: object
      additionalProperties: false
      properties:
        passkey:
          $ref: "#/components/schemas/Passkey"
        recovery_codes:
          type: array
          description: Present only when this was the first factor. Shown once.
          minItems: 10
          maxItems: 10
          items:
            type: string
            pattern: "^[a-z2-7]{5}-[a-z2-7]{5}$"
        admin:
          $ref: "#/components/schemas/Admin"
    RecoveryCodes:
      type: object
      additionalProperties: false
      required: [recovery_codes]
      properties:
        recovery_codes:
          type: array
          description: Shown once.
          minItems: 10
          maxItems: 10
          items:
            type: string
            pattern: "^[a-z2-7]{5}-[a-z2-7]{5}$"
    WebAuthnOptions:
      type: object
      description: >
        { publicKey: PublicKeyCredentialCreationOptionsJSON or
        PublicKeyCredentialRequestOptionsJSON } as defined by WebAuthn Level 3, base64url fields.
      required: [publicKey]
      properties:
        publicKey:
          type: object
    WebAuthnResponse:
      type: object
      description: PublicKeyCredential.toJSON() output (WebAuthn Level 3). The whole request body is at most 16 KiB.
      required: [id, rawId, type, response]
      properties:
        id:
          type: string
        rawId:
          type: string
        type:
          type: string
          enum: [public-key]
        response:
          type: object
    TokenRequest:
      type: object
      additionalProperties: false
      required: [name, scope]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 64
          examples: ["home-assistant"]
        scope:
          $ref: "#/components/schemas/Scope"
    Scope:
      type: string
      enum: [read, write]
    Token:
      type: object
      additionalProperties: false
      required: [id, name, scope, created_at, last_used_at, revoked_at]
      properties:
        id:
          type: integer
        name:
          type: string
        scope:
          $ref: "#/components/schemas/Scope"
        created_at:
          type: string
          format: date-time
        last_used_at:
          type: [string, "null"]
          format: date-time
          description: Accurate to about 1 minute; null if never used.
        revoked_at:
          type: [string, "null"]
          format: date-time
    NewToken:
      allOf:
        - $ref: "#/components/schemas/Token"
        - type: object
          required: [secret]
          properties:
            secret:
              type: string
              description: The token, shown only in this response.
              examples: ["bmt_<43 base64url characters>"]
    HexColor:
      type: string
      pattern: "^#[0-9a-f]{6}$"
    BeerStatus:
      type: string
      enum: [planned, fermenting, conditioning, ready]
    ValidationError:
      type: object
      required: [error, message]
      properties:
        error:
          type: string
        message:
          type: string
        fields:
          type: object
          additionalProperties:
            type: string
    Beer:
      type: object
      additionalProperties: false
      required: [id, name, style, abv, ibu, srm, color, description, brewer, brew_date,
        status, source, source_ref, archived_at, on_tap, sync, created_at, updated_at]
      properties:
        id: {type: integer}
        name: {type: string}
        style: {type: [string, "null"]}
        abv: {type: [number, "null"]}
        ibu: {type: [integer, "null"]}
        srm: {type: [number, "null"]}
        color:
          oneOf:
            - $ref: "#/components/schemas/HexColor"
            - type: "null"
        description: {type: [string, "null"]}
        brewer: {type: [string, "null"]}
        brew_date: {type: [string, "null"], format: date}
        status:
          $ref: "#/components/schemas/BeerStatus"
        source:
          type: string
          enum: [manual, brewfather]
        source_ref: {type: [string, "null"]}
        archived_at: {type: [string, "null"], format: date-time}
        on_tap:
          type: boolean
          description: True when a current keg of this beer is on a tap
        sync:
          description: Null for a manual beer; the import sync state otherwise.
          oneOf:
            - $ref: "#/components/schemas/BeerSync"
            - type: "null"
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
    BeerCreate:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name: {type: string, minLength: 1, maxLength: 100}
        style: {type: [string, "null"], maxLength: 100}
        abv: {type: [number, "null"], minimum: 0, maximum: 25, description: At most one decimal place.}
        ibu: {type: [integer, "null"], minimum: 0, maximum: 200}
        srm: {type: [number, "null"], minimum: 0, maximum: 100, description: At most one decimal place.}
        description: {type: [string, "null"], maxLength: 2000}
        brewer: {type: [string, "null"], maxLength: 100}
        brew_date: {type: [string, "null"], format: date}
        status:
          description: Absent or null means ready.
          anyOf:
            - $ref: "#/components/schemas/BeerStatus"
            - type: "null"
    BeerPatch:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        name: {type: string, minLength: 1, maxLength: 100}
        style: {type: [string, "null"], maxLength: 100}
        abv: {type: [number, "null"], minimum: 0, maximum: 25, description: At most one decimal place.}
        ibu: {type: [integer, "null"], minimum: 0, maximum: 200}
        srm: {type: [number, "null"], minimum: 0, maximum: 100, description: At most one decimal place.}
        description: {type: [string, "null"], maxLength: 2000}
        brewer: {type: [string, "null"], maxLength: 100}
        brew_date: {type: [string, "null"], format: date}
        status:
          $ref: "#/components/schemas/BeerStatus"
        archived: {type: boolean}
    Tap:
      type: object
      required: [id, position, label, enabled, keg, created_at, updated_at]
      properties:
        id: { type: integer }
        position: { type: integer, minimum: 1 }
        label: { type: string }
        enabled: { type: boolean }
        keg:
          oneOf:
            - $ref: "#/components/schemas/Keg"
            - type: "null"
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    TapCreate:
      type: object
      additionalProperties: false
      properties:
        label: { type: string, minLength: 1, maxLength: 50 }
        enabled: { type: boolean, default: true }
    TapPatch:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        label: { type: string, minLength: 1, maxLength: 50 }
        enabled: { type: boolean }
    TapOrder:
      type: object
      additionalProperties: false
      required: [ids]
      properties:
        ids:
          type: array
          items: { type: integer, minimum: 1 }
    KegTypeKey:
      type: string
      enum: [corny_2_5_gal, corny_3_gal, corny_5_gal, sanke_sixth, sanke_quarter, sanke_half,
        euro_20_l, euro_30_l, euro_50_l]
    KegType:
      type: object
      required: [type, label, size_l, shape]
      properties:
        type: { $ref: "#/components/schemas/KegTypeKey" }
        label: { type: string }
        size_l: { type: number }
        shape: { type: string, enum: [corny, sanke] }
    Keg:
      type: object
      required: [id, beer_id, beer_name, beer_color, type, size_l, remaining_l, tap_id, tap_label,
        state, tapped_at, kicked_at, created_at, updated_at]
      properties:
        id: { type: integer }
        beer_id: { type: integer }
        beer_name: { type: string }
        beer_color:
          oneOf:
            - $ref: "#/components/schemas/HexColor"
            - type: "null"
        type: { $ref: "#/components/schemas/KegTypeKey" }
        size_l: { type: number, description: "Litres, two decimals" }
        remaining_l: { type: number, description: "Litres, two decimals" }
        tap_id: { type: [integer, "null"] }
        tap_label:
          type: [string, "null"]
          description: The tap's label while on a tap, else the label of the last tap it was on
        state: { type: string, enum: [on_tap, waiting, kicked] }
        tapped_at: { type: [string, "null"], format: date-time }
        kicked_at: { type: [string, "null"], format: date-time }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    KegCreate:
      type: object
      additionalProperties: false
      required: [beer_id]
      properties:
        beer_id: { type: integer, minimum: 1 }
        type: { $ref: "#/components/schemas/KegTypeKey" }
        size_l: { type: number, exclusiveMinimum: 0, maximum: 100 }
        remaining_l: { type: number, minimum: 0, maximum: 100 }
        tap_id: { type: [integer, "null"], minimum: 1 }
    KegPatch:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        beer_id: { type: integer, minimum: 1 }
        type: { $ref: "#/components/schemas/KegTypeKey" }
        size_l: { type: number, exclusiveMinimum: 0, maximum: 100 }
        remaining_l: { type: number, minimum: 0, maximum: 100 }
        tap_id: { type: [integer, "null"], minimum: 1 }
        kicked: { type: boolean, const: true }
    Pour:
      type: object
      additionalProperties: false
      required: [amount_l]
      properties:
        amount_l: { type: number, exclusiveMinimum: 0, maximum: 100 }
    Menu:
      type: object
      additionalProperties: false
      required: [taps, on_deck, display]
      properties:
        display:
          $ref: "#/components/schemas/MenuDisplay"
        taps:
          type: array
          description: Enabled taps in position order.
          items:
            $ref: "#/components/schemas/MenuTap"
        on_deck:
          type: array
          description: Waiting kegs (oldest first), then conditioning beers, then fermenting beers, each by name.
          items:
            $ref: "#/components/schemas/OnDeckItem"
    MenuTap:
      type: object
      additionalProperties: false
      required: [label, beer, keg]
      properties:
        label:
          type: string
        beer:
          description: Null when the tap is empty.
          oneOf:
            - $ref: "#/components/schemas/MenuBeer"
            - type: "null"
        keg:
          description: Null exactly when beer is null.
          oneOf:
            - $ref: "#/components/schemas/MenuKeg"
            - type: "null"
    OnDeckItem:
      type: object
      additionalProperties: false
      required: [beer, keg, status]
      properties:
        beer:
          $ref: "#/components/schemas/MenuBeer"
        keg:
          description: A waiting keg, or null for a beer still being made.
          oneOf:
            - $ref: "#/components/schemas/MenuKeg"
            - type: "null"
        status:
          description: Set exactly when keg is null.
          type: [string, "null"]
          enum: [fermenting, conditioning, null]
    MenuBeer:
      type: object
      additionalProperties: false
      required: [name, style, abv, ibu, color]
      description: >
        srm and description appear on tap beers only, each omitted when unset; on deck beers
        never carry them.
      properties:
        name:
          type: string
        style:
          type: [string, "null"]
        abv:
          type: [number, "null"]
          description: Percent alcohol by volume.
        ibu:
          type: [number, "null"]
        color:
          description: Display color from SRM; null without SRM.
          oneOf:
            - $ref: "#/components/schemas/HexColor"
            - type: "null"
        srm:
          type: number
          description: SRM color value. Tap beers only; omitted when unset.
        description:
          type: string
          maxLength: 2000
          description: Plain text the owner wrote. Tap beers only; omitted when unset.
    MenuKeg:
      type: object
      additionalProperties: false
      required: [shape, level]
      properties:
        shape:
          type: string
          enum: [corny, sanke]
        level:
          type: number
          minimum: 0
          maximum: 1
          description: Fraction of the keg left. Not rounded.
    Theme:
      type: string
      enum: [dark, light]
      description: TV theme. Default dark. Does not change the admin app.
    Units:
      type: string
      enum: [us, metric]
      description: >
        Admin-app volume units. us shows US gallons and takes pours in US fl oz; metric shows
        litres and takes pours in mL. Volumes in the API are always litres.
    Title:
      type: string
      maxLength: 60
      description: >
        TV title, trimmed; empty means no title row. At most 60 code points, no control
        characters.
    PageSeconds:
      type: integer
      minimum: 5
      maximum: 300
      description: Seconds each TV page shows before the next. Default 15.
    Layout:
      type: string
      enum: [grid, list, columns]
      description: >
        TV layout. grid is the card grid from before feature 10 (default); list is one row per
        item, taps then on deck; columns is taps and on deck side by side.
    TitleAlign:
      type: string
      enum: [left, center, right]
      description: Title alignment on the TV. Default left.
    FontKey:
      type: string
      enum: [system, inter, lora, roboto-slab, oswald, nunito, bebas-neue, pacifico]
      description: A font shipped with the app. system is the font from before feature 10 (default).
    TextColor:
      type: string
      pattern: "^(#[0-9a-fA-F]{6})?$"
      description: >
        A #rrggbb color, stored and returned lowercase, or empty for the theme's own color
        (default). Not contrast-checked.
    Settings:
      type: object
      additionalProperties: false
      required: [title, theme, units, page_seconds, layout, title_align, title_font, text_font,
        show_style, show_abv, show_ibu, show_srm, show_description, title_color, text_color]
      properties:
        title: { $ref: "#/components/schemas/Title" }
        theme: { $ref: "#/components/schemas/Theme" }
        units: { $ref: "#/components/schemas/Units" }
        page_seconds: { $ref: "#/components/schemas/PageSeconds" }
        layout: { $ref: "#/components/schemas/Layout" }
        title_align: { $ref: "#/components/schemas/TitleAlign" }
        title_font: { $ref: "#/components/schemas/FontKey" }
        text_font: { $ref: "#/components/schemas/FontKey" }
        show_style: { type: boolean, description: "Show style on tap cards. Default true." }
        show_abv: { type: boolean, description: "Show ABV on tap cards. Default true." }
        show_ibu: { type: boolean, description: "Show IBU on tap cards. Default true." }
        show_srm: { type: boolean, description: "Show SRM as a number on tap cards. Default false." }
        show_description: { type: boolean, description: "Show the description, clamped to 2 lines, on tap cards. Default false." }
        title_color: { $ref: "#/components/schemas/TextColor" }
        text_color: { $ref: "#/components/schemas/TextColor" }
    SettingsPatch:
      type: object
      additionalProperties: false
      minProperties: 1
      description: Merge patch. Every field is optional; null is refused; all-or-nothing.
      properties:
        title: { $ref: "#/components/schemas/Title" }
        theme: { $ref: "#/components/schemas/Theme" }
        units: { $ref: "#/components/schemas/Units" }
        page_seconds: { $ref: "#/components/schemas/PageSeconds" }
        layout: { $ref: "#/components/schemas/Layout" }
        title_align: { $ref: "#/components/schemas/TitleAlign" }
        title_font: { $ref: "#/components/schemas/FontKey" }
        text_font: { $ref: "#/components/schemas/FontKey" }
        show_style: { type: boolean }
        show_abv: { type: boolean }
        show_ibu: { type: boolean }
        show_srm: { type: boolean }
        show_description: { type: boolean }
        title_color: { $ref: "#/components/schemas/TextColor" }
        text_color: { $ref: "#/components/schemas/TextColor" }
    MenuDisplay:
      type: object
      additionalProperties: false
      description: The TV's settings. Never includes units.
      required: [title, theme, page_seconds, layout, title_align, title_font, text_font,
        show_style, show_abv, show_ibu, show_srm, show_description, title_color, text_color]
      properties:
        title: { $ref: "#/components/schemas/Title" }
        theme: { $ref: "#/components/schemas/Theme" }
        page_seconds: { $ref: "#/components/schemas/PageSeconds" }
        layout: { $ref: "#/components/schemas/Layout" }
        title_align: { $ref: "#/components/schemas/TitleAlign" }
        title_font: { $ref: "#/components/schemas/FontKey" }
        text_font: { $ref: "#/components/schemas/FontKey" }
        show_style: { type: boolean }
        show_abv: { type: boolean }
        show_ibu: { type: boolean }
        show_srm: { type: boolean }
        show_description: { type: boolean }
        title_color: { $ref: "#/components/schemas/TextColor" }
        text_color: { $ref: "#/components/schemas/TextColor" }
    SyncInterval:
      type: string
      enum: ["off", 15m, 1h, 6h, 24h]
    BrewfatherCredentials:
      type: object
      additionalProperties: false
      required: [user_id, api_key]
      properties:
        user_id: {type: string, minLength: 1, maxLength: 200}
        api_key:
          type: string
          minLength: 1
          maxLength: 500
          writeOnly: true
    BrewfatherStatus:
      type: object
      additionalProperties: false
      required: [configured, connected, reconnect_needed, interval, sync_running, retry_at, last_sync]
      properties:
        configured:
          type: boolean
          description: False when the server has no encryption key; nothing else works then.
        connected: {type: boolean}
        reconnect_needed:
          type: boolean
          description: Stored credentials cannot be decrypted with the server's current key.
        interval:
          $ref: "#/components/schemas/SyncInterval"
        sync_running: {type: boolean}
        retry_at:
          type: [string, "null"]
          format: date-time
          description: While Brewfather's rate limit holds, the time calls resume.
        last_sync:
          oneOf:
            - $ref: "#/components/schemas/LastSync"
            - type: "null"
    LastSync:
      type: object
      additionalProperties: false
      required: [started_at, finished_at, ok, message, updated, imported, not_found]
      properties:
        started_at: {type: string, format: date-time}
        finished_at: {type: [string, "null"], format: date-time}
        ok: {type: [boolean, "null"]}
        message: {type: [string, "null"]}
        updated: {type: integer}
        imported: {type: integer}
        not_found: {type: integer}
    BatchSummary:
      type: object
      additionalProperties: false
      required: [id, name, number, status, brew_date, beer_id]
      properties:
        id: {type: string, description: Provider batch ID}
        name: {type: string}
        number: {type: [integer, "null"]}
        status:
          type: string
          enum: [planned, fermenting, conditioning, ready]
          description: Already mapped to a beer status.
        brew_date: {type: [string, "null"], format: date}
        beer_id:
          type: [integer, "null"]
          description: The beer imported from this batch, or null.
    ImportResult:
      type: object
      additionalProperties: false
      required: [batch_id, outcome, beer, adjusted, message]
      properties:
        batch_id: {type: string}
        outcome:
          type: string
          enum: [imported, already_imported, archived, not_found, rate_limited, failed]
        beer:
          description: The new beer, or the existing one for already_imported.
          oneOf:
            - $ref: "#/components/schemas/Beer"
            - type: "null"
        adjusted:
          type: array
          items: {type: string}
          description: Beer fields cleaned or emptied to pass the beer rules.
        message: {type: [string, "null"]}
    BeerSync:
      type: object
      additionalProperties: false
      required: [synced_at, not_found, archive_pending]
      properties:
        synced_at: {type: [string, "null"], format: date-time}
        not_found:
          type: boolean
          description: The provider no longer has this beer's batch.
        archive_pending:
          type: boolean
          description: The batch was archived but the beer has a current keg.
