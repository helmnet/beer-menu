# Opens an issue when one of the newest 5 Brewfather changelog entries mentions the API, so the
# owner hears about Brewfather API changes. Runs daily and on demand; one issue per version, never
# reopened or duplicated. A failed fetch fails the run, so GitHub emails the owner.
name: brewfather-changelog

on:
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:

permissions:
  issues: write

jobs:
  watch:
    runs-on: ubuntu-latest
    steps:
      # The changelog is untrusted: it is only passed to commands as quoted arguments, never evaluated.
      - env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          # Drop CRs: Markdown ends a line at a bare CR, which would let text escape the code block below.
          log=$(curl -sfL https://docs.brewfather.app/changelog.md | tr -d '\r')
          # A moved page still answers 200 with a GitBook help page, so check it looks like the changelog.
          if ! grep -Eq '^## [0-9.]+ - [0-9]{2}\.[0-9]{2}\.[0-9]{4}$' <<<"$log"; then
            echo "::error::no '## <version> - <DD.MM.YYYY>' heading in the Brewfather changelog"; exit 1
          fi
          # Whole case-sensitive word, so "RAPT" does not match.
          api='(^|[^A-Za-z])API([^A-Za-z]|$)'
          # API lines in the newest 5 sections, which start at "## <version> - <DD.MM.YYYY>"; the banner
          # above the first one is skipped. v is the section's version heading.
          # shellcheck disable=SC2016 # awk program, expanded by awk
          api_lines='/^## /{n++; v=substr($0,4); next} n && n<=5 && $0 ~ re'
          printf '%s\n' "$log" |
            awk -v re="$api" "$api_lines"' {print v}' |
            uniq |
            while IFS= read -r version; do
              title="Brewfather API change: $version"
              # Exact match over a plain listing: in a --search query, heading text could alter the query.
              # shortcut: only the newest 1000 issues are checked, raise --limit if the repo outgrows it.
              found=$(gh issue list --state all --limit 1000 --json title </dev/null |
                jq --arg t "$title" 'any(.[]; .title == $t)')
              if [ "$found" = false ]; then
                # Indented as a code block so changelog text cannot @mention anyone or render links.
                lines=$(printf '%s\n' "$log" |
                  awk -v re="$api" -v want="$version" "$api_lines"' && v == want' |
                  sed 's/^/    /')
                gh issue create --title "$title" </dev/null --body "$(printf '%s\n\n%s\n' \
                  'The Brewfather changelog (https://docs.brewfather.app/changelog) mentions the API:' "$lines")"
              fi
            done
