# Pull request and main-branch checks, skipped when only Markdown files change. Never merge while
# any job below (api, web, openapi, images) or secrets.yml fails; see "Required checks" in README.md.
name: ci

on:
  pull_request:
    paths-ignore: ['**/*.md']
  push:
    branches: [main]
    paths-ignore: ['**/*.md']

permissions:
  contents: read

jobs:
  api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: api/go.mod
          cache-dependency-path: api/go.sum
      - run: go vet ./...
      - run: go test ./...

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build

  openapi:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
      - run: npx --yes @redocly/cli@2.71.0 lint api/openapi.yaml

  images:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Tags both images with the compose file's names, so the smoke test never pulls from GHCR.
      - run: docker compose build
      # A scratch image with no group part runs as GID 0, so both parts must be set and non-root.
      - name: Check the images' default user is non-root
        run: |
          for img in $(docker compose config --images); do
            u=$(docker image inspect -f '{{.Config.User}}' "$img")
            user=${u%%:*} group=${u#*:}
            if [[ "$u" != *:* || -z "$user" || -z "$group" ]]; then
              echo "::error::$img: user '$u' is not user:group"; exit 1
            fi
            for id in "$user" "$group"; do
              if [[ "$id" == 0 || "$id" == root ]]; then
                echo "::error::$img: user '$u' is root"; exit 1
              fi
            done
            echo "$img runs as $u"
          done
      - name: Check both images refuse to run as root
        run: |
          for img in $(docker compose config --images); do
            for opts in "--user 0:0" "--user 12345:0" "--user 12345:12345 --group-add 0"; do
              # shellcheck disable=SC2086 # opts holds several flags
              out=$(timeout 30 docker run --rm $opts "$img" 2>&1) || true
              if [[ "$out" != *"refusing to run as root"* ]]; then
                echo "::error::$img with $opts did not refuse to start: $out"; exit 1
              fi
              echo "$img refuses $opts"
            done
          done
      # Fails only on HIGH or CRITICAL findings that have a fixed version available.
      # Scans a saved tarball so the third-party scanner never gets the Docker socket (root on the runner).
      - name: Scan both images for vulnerabilities
        run: |
          for img in $(docker compose config --images); do
            docker save -o "$RUNNER_TEMP/image.tar" "$img"
            docker run --rm -v "$RUNNER_TEMP/image.tar:/image.tar:ro" \
              aquasec/trivy:0.76.1@sha256:790fd66d1697395d8693d1acaa1ea702406a20f109b6fc7bac8db623eca6c06c \
              image --input /image.tar --scanners vuln --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1
          done
      # 12345:12345 is a UID/GID the images were not built for.
      - name: Smoke test as an arbitrary UID/GID
        env:
          PUID: "12345"
          PGID: "12345"
        run: |
          mkdir data && sudo chown 12345:12345 data
          docker compose up -d --no-build
          for _ in $(seq 1 60); do
            curl -fsS localhost:8080/api/health && break
            sleep 1
          done
          curl -fsS localhost:8080/api/health
          curl -fsS -o /dev/null localhost:8080/display
          # Security headers (research R11): each exactly once, so nginx and the API never double them.
          count() { curl -sI "localhost:8080$1" | grep -ci "^$2:" || true; }
          for path in / /display; do
            for h in X-Content-Type-Options X-Frame-Options Referrer-Policy Content-Security-Policy; do
              n=$(count "$path" "$h")
              if [[ "$n" != 1 ]]; then echo "::error::$path has $n $h headers, want 1"; exit 1; fi
            done
          done
          n=$(count /api/setup X-Frame-Options)
          if [[ "$n" != 1 ]]; then echo "::error::/api/setup has $n X-Frame-Options headers, want 1"; exit 1; fi
          if ! curl -sI localhost:8080/api/setup | grep -qi '^cache-control: no-store'; then
            echo "::error::/api/setup lacks Cache-Control: no-store"; exit 1
          fi
      - if: failure()
        run: docker compose logs
