# Gitleaks scan, kept apart from ci.yml so it runs on every change, Markdown-only ones included.
# Never merge while it fails; see "Required checks" in docs/development.md.
name: secrets

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      # Not gitleaks-action: it needs a paid license secret for organization repos.
      # The image ref lives in ci/images/gitleaks/Dockerfile, so Dependabot updates it.
      - run: |
          gitleaks=$(sh .github/ci/image.sh gitleaks)
          docker run --rm -v "$PWD:/repo:ro" "$gitleaks" detect --source /repo --redact
