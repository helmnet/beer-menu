# Publishes both images to GHCR when a vX.Y.Z tag is pushed, tagged X.Y.Z, X.Y and latest.
# Each image is scanned with Trivy before it is pushed.
# Once both images are published, creates a GitHub Release with each image's pull command and notes generated since the previous tag.
name: release

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    strategy:
      # Without this, one image failing its scan cancels the other mid-release (see "Releases" in docs/development.md).
      fail-fast: false
      matrix:
        image: [api, web]
    steps:
      # The tag glob also matches tags such as v1.2.3-rc1, which must not publish.
      - name: Check the tag is vX.Y.Z
        run: |
          if [[ ! "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::tag $GITHUB_REF_NAME is not vX.Y.Z"; exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/helmnet/beer-menu-${{ matrix.image }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest
          # GitHub reports the repo license as GPL-3.0; the project is GPL-3.0-or-later.
          labels: |
            org.opencontainers.image.licenses=GPL-3.0-or-later
      # Load locally instead of pushing, so the image is scanned before anything is published.
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ./${{ matrix.image }}
          platforms: linux/amd64
          push: false
          load: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: VERSION=${{ steps.meta.outputs.version }}
      # Same scan as ci.yml: fails only on HIGH or CRITICAL findings that have a fixed version available.
      # Scans a saved tarball so the third-party scanner never gets the Docker socket (root on the runner).
      - name: Scan the image for vulnerabilities
        env:
          IMAGE: ghcr.io/helmnet/beer-menu-${{ matrix.image }}
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          trivy=$(sh .github/ci/image.sh trivy)
          docker save -o "$RUNNER_TEMP/image.tar" "$IMAGE:$VERSION"
          docker run --rm -v "$RUNNER_TEMP/image.tar:/image.tar:ro" \
            "$trivy" \
            image --input /image.tar --scanners vuln --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1
      # Logs in only now, so the token is not on disk while the build and scan run third-party code.
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # Pushes the scanned local image, so the published bytes are the ones that passed the scan.
      - name: Push all tags
        env:
          IMAGE: ghcr.io/helmnet/beer-menu-${{ matrix.image }}
        run: docker push --all-tags "$IMAGE"

  # Waits for both images, so no Release exists for a version whose images failed the scan or push.
  github-release:
    needs: publish
    runs-on: ubuntu-latest
    # Job-scoped: replaces the workflow-level set, so only this job can write releases (no packages: write).
    permissions:
      contents: write
    steps:
      - name: Create the GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # --notes is prepended to the generated notes, so readers see how to pull this version first.
        run: |
          version=${GITHUB_REF_NAME#v}
          notes='## Docker images'
          for image in api web; do
            notes+=$(printf '\n- [beer-menu-%s](https://github.com/%s/pkgs/container/beer-menu-%s): `docker pull ghcr.io/helmnet/beer-menu-%s:%s`' \
              "$image" "$GITHUB_REPOSITORY" "$image" "$image" "$version")
          done
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --verify-tag --generate-notes --notes "$notes"
