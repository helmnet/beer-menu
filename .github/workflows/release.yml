# Publishes both images to GHCR when a vX.Y.Z tag is pushed, tagged X.Y.Z, X.Y and latest.
# Each image is scanned with Trivy before it is pushed.
name: release

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    strategy:
      # Without this, one image failing its scan cancels the other mid-release (see README "Releases").
      fail-fast: false
      matrix:
        image: [api, web]
    steps:
      # The tag glob also matches tags such as v1.2.3-rc1, which must not publish.
      - name: Check the tag is vX.Y.Z
        run: |
          if [[ ! "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::tag $GITHUB_REF_NAME is not vX.Y.Z"; exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/helmnet/beer-menu-${{ matrix.image }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest
      # Load locally instead of pushing, so the image is scanned before anything is published.
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ./${{ matrix.image }}
          platforms: linux/amd64
          push: false
          load: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: VERSION=${{ steps.meta.outputs.version }}
      # Same scan as ci.yml: fails only on HIGH or CRITICAL findings that have a fixed version available.
      # Scans a saved tarball so the third-party scanner never gets the Docker socket (root on the runner).
      - name: Scan the image for vulnerabilities
        env:
          IMAGE: ghcr.io/helmnet/beer-menu-${{ matrix.image }}
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          docker save -o "$RUNNER_TEMP/image.tar" "$IMAGE:$VERSION"
          docker run --rm -v "$RUNNER_TEMP/image.tar:/image.tar:ro" \
            aquasec/trivy:0.76.1@sha256:790fd66d1697395d8693d1acaa1ea702406a20f109b6fc7bac8db623eca6c06c \
            image --input /image.tar --scanners vuln --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1
      # Logs in only now, so the token is not on disk while the build and scan run third-party code.
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # Pushes the scanned local image, so the published bytes are the ones that passed the scan.
      - name: Push all tags
        env:
          IMAGE: ghcr.io/helmnet/beer-menu-${{ matrix.image }}
        run: docker push --all-tags "$IMAGE"
