version: 2
# cooldown: skip versions under 7 days old, so a hijacked release is likely yanked before a PR; security updates ignore it.
updates:
  - package-ecosystem: gomod
    directory: /api
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      gomod-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /web
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      npm-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: docker
    directories: [/api, /web]
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      docker-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      github-actions-minor-patch:
        update-types: [minor, patch]
