version: 2
# cooldown: skip versions under 7 days old, so a hijacked release is likely yanked before a PR; security updates ignore it.
updates:
  - package-ecosystem: gomod
    directory: /api
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      gomod-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /web
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      # react: listed first so it wins (a dependency joins only its first matching group); @types/react-dom peer-pins @types/react's major, so these must move together, majors included.
      react:
        patterns: [react, react-dom, "@types/react", "@types/react-dom"]
      npm-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: docker
    # ci/images: scanner images the workflows run, pinned in never-built Dockerfiles so Dependabot sees them.
    # Outside .github/: Dependabot cannot open pull requests that change files there (other than workflows).
    directories: [/api, /web, /ci/images/gitleaks, /ci/images/trivy]
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      docker-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      github-actions-minor-patch:
        update-types: [minor, patch]
