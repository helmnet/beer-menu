# Example compose file for trying Beer Menu from a checkout or from released images.
#
# Production pins an exact X.Y.Z release in truenas_apps (BEER_MENU_VERSION=X.Y.Z) and
# never uses latest.
#
# Set PUID and PGID to any non-root UID and GID (never 0) that owns the data folder
# (BEER_MENU_DATA, default ./data). Both containers refuse to start as UID 0 or GID 0.
services:
  api:
    image: ghcr.io/helmnet/beer-menu-api:${BEER_MENU_VERSION:-latest}
    build: ./api
    user: "${PUID:-65532}:${PGID:-65532}"
    volumes:
      - ${BEER_MENU_DATA:-./data}:/data
    # environment:
    #   # First admin, created at startup only while no admin exists; set both or neither.
    #   BEER_MENU_ADMIN_USERNAME: owner
    #   # 12 to 256 characters, from your shell or an env file; never write the value here.
    #   BEER_MENU_ADMIN_PASSWORD: ${BEER_MENU_ADMIN_PASSWORD}
    #   # Default true; set false only for plain-HTTP access by LAN address (see README.md).
    #   BEER_MENU_COOKIE_SECURE: "false"
    #   # Encryption key for the stored Brewfather API key and authenticator-app secrets (see
    #   # README.md); read from the secret below. Without it, Brewfather import and
    #   # authenticator apps are off.
    #   BEER_MENU_SECRET_KEY_FILE: /run/secrets/beer_menu_secret_key
    #   # Or pass the key as a plain env var instead of the secret (the _FILE one wins if both
    #   # are set). Env values show in `docker inspect`, so the secret file is safer.
    #   BEER_MENU_SECRET_KEY: ${BEER_MENU_SECRET_KEY}
    #   # The address admins open the app at (scheme, host name and port if any, exactly as
    #   # the browser shows it). Needed for passkeys; unset, passkeys are off (see README.md).
    #   BEER_MENU_PUBLIC_URL: https://taplist.example.org
    # secrets:
    #   - beer_menu_secret_key
    restart: unless-stopped

  web:
    image: ghcr.io/helmnet/beer-menu-web:${BEER_MENU_VERSION:-latest}
    build: ./web
    user: "${PUID:-65532}:${PGID:-65532}"
    ports:
      - "${BEER_MENU_WEB_PORT:-8080}:8080"
    restart: unless-stopped

# Brewfather encryption key, used by the commented api settings above. Create the file once with
#   openssl rand -base64 32 > beer-menu-secret-key
# then chown it to PUID:PGID and chmod 0600: compose mounts it with the host file's owner and
# mode. It is git-ignored; keep a copy somewhere other than the data folder.
# secrets:
#   beer_menu_secret_key:
#     file: ./beer-menu-secret-key
# tmp 016 check
