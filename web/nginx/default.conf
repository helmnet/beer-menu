server {
    listen 8080;
    server_tokens off;

    # Docker's embedded DNS, re-resolved per request so nginx starts and serves static
    # pages while the api container is down (returns 502 for /api until it is back).
    resolver 127.0.0.11 valid=10s;

    root /usr/share/nginx/html;

    location /api/ {
        set $api http://api:8080;
        proxy_pass $api;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Client routes such as /display fall back to the SPA entry point.
    location / {
        try_files $uri /index.html;
    }
}
