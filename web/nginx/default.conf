server {
    listen 8080;
    server_tokens off;

    # Docker's embedded DNS, re-resolved per request so nginx starts and serves static
    # pages while the api container is down (returns 502 for /api until it is back).
    resolver 127.0.0.11 valid=10s;

    root /usr/share/nginx/html;

    location /api/ {
        set $api http://api:8080;
        proxy_pass $api;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Client routes such as /display fall back to the SPA entry point. The security headers
    # live here, not in the server block, so proxied /api responses keep only the API's own
    # headers instead of getting each one twice (research R11).
    location / {
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy same-origin always;
        add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
        try_files $uri /index.html;

        # The image's mime.types has no .webmanifest entry. Nested, so it keeps the headers above.
        location = /manifest.webmanifest {
            types { application/manifest+json webmanifest; }
        }
    }
}
